# Mod properties and dependency versions per node.
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "c0de_paint"
mod.name = "c0de paint"
mod.group = "de.joernott.c0depaint"
mod.version = "0.1.0"
mod.description = "Drawing library for c0de: c0de_paint/cpaint draws lines, shapes and bodies into canvases, transforms them and builds them in the world."
mod.authors = "Jörn Ott"
mod.license = "BSD-3-Clause"
mod.sources_url = "https://github.com/joernott/minecraft-c0de-paint"
mod.issues_url = "https://github.com/joernott/minecraft-c0de-paint/issues"
# The ID of the Modrinth project (task 8.3); publishMods is a dry run without it or without MODRINTH_TOKEN
publish.modrinth_id = "zuHwh3ir"
# The ID of the CurseForge project (task 8.3); publishMods is a dry run without it or without CURSEFORGE_TOKEN
publish.curseforge_id = "1822987"

# The version of c0de the mod is built and tested against
deps.c0de = "0.7.0"
# The oldest version of c0de the mod works with: the mod requires it or any later version with the same major
# version. 0.7.0 introduced library types (docs/concept.md#types).
deps.c0de_min = "0.7.0"
deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.18-SNAPSHOT"

# The Minecraft and loader versions are the ones of c0de (stonecutter.properties.toml of minecraft-c0de)
["1.21.1"]
# Releases the mod is marked compatible with on Modrinth, separated by commas
mod.mc_releases = "1.21.1"
deps.parchment = "2024.11.17"

[fabric."1.21.1"]
# Compatibility range in fabric.mod.json
mod.mc_compat = "~1.21.1"
deps.fabric_api = "0.116.17+1.21.1"

[neoforge."1.21.1"]
# Compatibility range in neoforge.mods.toml
mod.mc_compat = "[1.21.1, 1.21.2)"
deps.neo_loader = "21.1.264"

["1.21.11"]
mod.mc_releases = "1.21.11"
deps.parchment = "2025.12.20"

[fabric."1.21.11"]
mod.mc_compat = "~1.21.11"
deps.fabric_api = "0.141.6+1.21.11"

[neoforge."1.21.11"]
mod.mc_compat = "[1.21.11, 1.21.12)"
deps.neo_loader = "21.11.48"

["26.1.2"]
mod.mc_releases = "26.1.2"
# Unobfuscated: no Parchment mappings needed
deps.fabric_loader = "0.20.1"

[fabric."26.1.2"]
mod.mc_compat = "~26.1.2"
deps.fabric_api = "0.155.3+26.1.2"

[neoforge."26.1.2"]
mod.mc_compat = "[26.1.2, 26.1.3)"
deps.neo_loader = "26.1.2.124"

["26.2"]
mod.mc_releases = "26.2"
deps.fabric_loader = "0.20.1"

[fabric."26.2"]
mod.mc_compat = "~26.2"
deps.fabric_api = "0.161.0+26.2"

[neoforge."26.2"]
mod.mc_compat = "[26.2, 26.2.1)"
deps.neo_loader = "26.2.0.93"

["26.3"]
mod.mc_releases = "26.3"
deps.fabric_loader = "0.20.1"

[fabric."26.3"]
mod.mc_compat = "~26.3"
deps.fabric_api = "0.165.0+26.3"

[neoforge."26.3"]
mod.mc_compat = "[26.3, 26.3.1)"
deps.neo_loader = "26.3.0.99"
